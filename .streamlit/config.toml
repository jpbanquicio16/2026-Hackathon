# Streamlit reads this file when the app is started from the repository root,
# which is also how Streamlit Community Cloud starts it.

[server]
# Upload limit in MB (Streamlit's default is 200). Each interaction takes about
# 0.5 s per 6 MB of CSV, and a parsed file needs over twice its size in memory,
# so much larger uploads are slow and can exhaust a free Community Cloud app.
maxUploadSize = 25

# Colour scheme: Café Noir #4C3D19, Kombu Green #354024, Moss Green #889063,
# Tan #CFBB99 and Bone #E5D7C4. Every text colour below clears 4.5:1 on the
# surface it sits on; alert text is set explicitly because the derived shades don't.
[theme]
font = "Poppins:https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap, sans-serif"
headingFont = "Playfair Display:https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&display=swap, serif"
headingFontWeights = 600
metricValueFontWeight = 600
baseRadius = "0.75rem"
buttonRadius = "0.75rem"
showWidgetBorder = true
showSidebarBorder = false
# Earth-toned categorical slots, validated for colour-vision separation on both surfaces.
chartCategoricalColors = ["#018d87", "#ba882e", "#9a4873", "#8b902d", "#3a75af", "#5d7e28"]

[theme.light]
backgroundColor = "#f8f4ec"
secondaryBackgroundColor = "#efe7da"
textColor = "#2e2616"
